[project]
name = "openpaso"
version = "1.1.0"
description = "openPASO — open Platform for Agentic Simulation and Optimization. An MCP server that lets an AI model operate nine finite-element and multiphysics codes: simulation, cross-code coupling, verification and solver development."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "openPASO Contributors"},
]
keywords = ["fem", "mcp", "simulation", "multiphysics", "coupling",
            "ai-agent", "verification", "finite-element"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Physics",
    "Programming Language :: Python :: 3",
]

dependencies = [
    # PINNED BELOW 2. mcp 2.x renamed FastMCP to MCPServer and changed other
    # APIs, so server.py stops at import with "No module named
    # 'mcp.server.fastmcp'". The old bound was >=1.2.0, which today resolves
    # to 2.x: every fresh install was broken while existing environments kept
    # working on an older resolution, so nothing here noticed. Measured on a
    # clean venv, Python 3.13, which picked mcp 2.2.0.
    "mcp[cli]>=1.2.0,<2",
    # src/blind_eval/{derive,leakgate,coupled}.py import it at module level.
    # It was never declared: a clean install could not even collect the test
    # suite ("No module named 'sympy'"), and importing those modules failed.
    "sympy>=1.12",
    "pyyaml>=6.0",
    # numpy capped <2 because pyprecice pins numpy<2; scipy capped <1.16 because
    # scipy>=1.16 uses numpy-2-only dtypes (np.long) and requires numpy>=2.0,
    # which silently breaks scikit-fem on a numpy-1.x install (dep conflict).
    "numpy>=1.24,<2",
    "pyvista>=0.43",
    "meshio>=5.3",
    "h5py>=3.10",
    "matplotlib>=3.8",
    "scipy>=1.10,<1.16",
    # adios2 lets the verification gate scan ADIOS2/.bp output (dolfinx VTXWriter,
    # e.g. P2/Taylor-Hood Stokes) for NaN/Inf. Without it the gate cannot read
    # .bp and only emits an honesty note, so a NaN-filled .bp could read as
    # verified — the SEV-HIGH fabrication gap this closes.
    "adios2>=2.10",
    # generate_mesh imports gmsh IN THIS INTERPRETER, unlike the solvers, which are found
    # wherever they live. Measured on a real run: every solver was found, the mesh tool could
    # not work, the model wrote its own gmsh script which could not import gmsh either, and the
    # run spent its budget producing nothing. A mesh generator every install has is worth 50 MB.
    "gmsh>=4.12",
]

[project.optional-dependencies]
# Individual solver backends
fenics = ["fenics-dolfinx>=0.8"]     # gmsh is a core dependency, see above
ngsolve = ["ngsolve>=6.2"]
skfem = ["scikit-fem>=10.0"]
kratos = ["KratosMultiphysics>=10.0"]
dune = ["dune-fem>=2.10", "mpi4py>=3.0"]

# Coupling infrastructure
precice = ["pyprecice>=3.0"]

# All pip-installable backends
all-solvers = [
    "ngsolve>=6.2",
    "scikit-fem>=10.0",
    "KratosMultiphysics>=10.0",
]

# Development
dev = ["pytest>=7.0", "pytest-asyncio>=0.20"]
# Everything the test suite needs on top of the runtime dependencies.
# `pip install -e ".[dev]"` must be enough to run `pytest tests/`.

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# PASSING TESTS MUST NOT LEAVE WORKED ANSWERS ON THE MACHINE.
#
# pytest keeps the last three runs' tmp_path trees by default. Several tests
# here build COMPLETE coupled submissions to exercise the grader, and one
# fixture runs 4C and Kratos for real and leaves a finished two-slab coupled
# heat-transfer run on disk -- a real 4C deck, 4C's native output, and
# exports.json/imports.json on both sides.
#
# The blind campaign's agent runs as this same user with shell access, and a
# bare agent working coupled cell C2 was measured READING one of those trees,
# in a campaign whose headline is that the bare arm completes no coupled
# problem. Eleven copies had accumulated across /tmp and ~/tmp.
#
# "failed" keeps the trees for tests that FAIL, which is when they are wanted
# for debugging, and discards them for tests that pass, which is when they are
# only contamination.
tmp_path_retention_policy = "failed"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"
